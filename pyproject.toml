[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-text-tools"
version = "0.1.0"
description = "Match Uthmani Quran text with typed Arabic, and find and check quoted verses against the Mushaf"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Nasser Ba Break" }]
keywords = ["quran", "arabic", "uthmani", "nlp", "text-matching"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://quranicatlas.com"
Source = "https://github.com/NasserWasfiBaBreak/quran-text-tools"
Issues = "https://github.com/NasserWasfiBaBreak/quran-text-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]
